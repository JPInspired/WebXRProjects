<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kinematics Lab</title>
  <meta name="description" content="Kinematics in mixed reality (WebXR): drop things from a tower, swing pendulums, bounce springs and roll balls down a ramp, with displacement, velocity and acceleration charts and a datasheet.">
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <script src="config.js"></script>
</head>
<body>
  <div id="overlay">
    <h1>Kinematics Lab</h1>
    <p>Drop things from a tower, swing a pendulum, bounce a spring and roll a ball down a ramp. Chart the motion, fill in the datasheet, and find out what changes it.</p>
    <div class="buttons">
      <button id="btn-ar" disabled>Checking for mixed reality…</button>
      <button id="btn-vr" class="secondary" hidden>Enter VR</button>
    </div>
    <p class="hint" id="hint"></p>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
